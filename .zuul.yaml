---
- project:
    check:
      jobs:
        - openstack-tox-linters
        - k8sapp-dell-storage-tox-py39
        - k8sapp-dell-storage-tox-pylint
        - k8sapp-dell-storage-tox-flake8
        - k8sapp-dell-storage-tox-metadata
    gate:
      jobs:
        - openstack-tox-linters
        - k8sapp-dell-storage-tox-py39
        - k8sapp-dell-storage-tox-pylint
        - k8sapp-dell-storage-tox-flake8
        - k8sapp-dell-storage-tox-metadata
    post:
      jobs:
        - k8sapp-dell-storage-upload-git-mirror

- job:
    name: k8sapp-dell-storage-tox-py39
    parent: openstack-tox-py39
    description: |
            Run py39 test for k8sapp_dell_storage
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-dell-storage/*
    vars:
      tox_extra_args: -c python3-k8sapp-dell-storage/k8sapp_dell_storage/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-dell-storage-tox-metadata
    parent: tox
    description: |
            Run metadata test for k8sapp_dell_storage
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    vars:
      tox_envlist: metadata
      tox_extra_args: -c python3-k8sapp-dell-storage/k8sapp_dell_storage/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-dell-storage-tox-pylint
    parent: tox
    description: |
            Run pylint test for k8sapp_dell_storage
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-dell-storage/*
    vars:
      tox_envlist: pylint
      tox_extra_args: -c python3-k8sapp-dell-storage/k8sapp_dell_storage/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-dell-storage-tox-flake8
    parent: tox
    description: |
            Run flake8 test for k8sapp_dell_storage
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/root
    files:
      - python3-k8sapp-dell-storage/*
    vars:
      tox_envlist: flake8
      tox_extra_args: -c python3-k8sapp-dell-storage/k8sapp_dell_storage/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-dell-storage-upload-git-mirror
    parent: upload-git-mirror
    description: >
      Mirrors opendev.org/starlingx/app-dell-storage to
      github.com/starlingx/app-dell-storage
    vars:
      git_mirror_repository: starlingx/app-dell-storage
    secrets:
      - name: git_mirror_credentials
        secret: k8sapp-dell-storage-github-secret
        pass-to-parent: true

