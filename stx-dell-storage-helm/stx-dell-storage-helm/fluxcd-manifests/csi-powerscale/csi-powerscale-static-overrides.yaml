csm:
  authorization: false
  replication: false
  resiliency: false

# metrics: pinned false to match the app convention of explicitly disabling every
# optional feature. Required here because upstream 2.18.0 added four monitoring
# templates and defaults metrics.prometheusRule.enabled to TRUE, so setting only
# metrics.enabled=true would emit a monitoring.coreos.com/v1 PrometheusRule. The
# documented CSM-Observability topology installs Prometheus without the Prometheus
# Operator, so that CRD is absent and the HelmRelease would fail to reconcile.
metrics:
  enabled: false
  prometheusRule:
    enabled: false
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# isiAuthType: OneFS API authentication, 0 = basic, 1 = session-based.
# Pinned to 1, the upstream default since 2.18.0 (2.16.0 defaulted to 0),
# so the authentication mode is visible here. A deployment whose array only
# accepts basic authentication can set 0 with helm-override-update.
isiAuthType: 1

labels:
  isApplication: false

driver:
  image: quay.io/dell/container-storage-modules/csi-isilon:v2.18.0

controller:
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
  replication:
    image: quay.io/dell/container-storage-modules/dell-csi-replicator:v1.16.0
  snapshot:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
    snapNamePrefix: csi-powerscale-snap
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
  healthMonitor:
    image: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.18.0
  metadataretriever:
    image: quay.io/dell/container-storage-modules/csi-metadata-retriever:v1.15.0
  volumeNamePrefix: csi-powerscale-vol
  nodeSelector: {"node-role.kubernetes.io/control-plane": ""}
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

node:
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
  nodeSelector: {"kubernetes.io/os": "linux"}
  tolerations:
    - operator: "Exists"

authorization:
  image: quay.io/dell/container-storage-modules/csm-authorization-sidecar:v2.6.0
  rootCertificate:

podmon:
  image: quay.io/dell/container-storage-modules/podmon:v1.17.0

driverName: "csi-isilon.dellemc.com"

proxyAuthzTokens:
  access:
  refresh:

secret:

storageClasses:

snapshotClasses:
  - name: csi-powerscale-snapshotclass
