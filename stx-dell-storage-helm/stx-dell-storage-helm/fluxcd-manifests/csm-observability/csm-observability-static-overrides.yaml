karaviMetricsPowerstore:
  enabled: true
  image: quay.io/dell/container-storage-modules/csm-metrics-powerstore:v1.14.0
karaviMetricsPowerflex:
  enabled: false
  image: quay.io/dell/container-storage-modules/csm-metrics-powerflex:v1.14.0
karaviMetricsPowerscale:
  enabled: false
  image: quay.io/dell/container-storage-modules/csm-metrics-powerscale:v1.11.0
karaviMetricsPowermax:
  enabled: false
  image: quay.io/dell/container-storage-modules/csm-metrics-powermax:v1.9.0
