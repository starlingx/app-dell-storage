csm:
  replication: false
  resiliency: false

controller:
  metadataretriever:
    image: quay.io/dell/container-storage-modules/csi-metadata-retriever:v1.15.0
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
  healthMonitor:
    image: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.18.0
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
  replication:
    image: quay.io/dell/container-storage-modules/dell-csi-replicator:v1.16.0
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
  snapshot:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
    snapNamePrefix: csi-powerstore-snap
  volumeNamePrefix: csi-powerstore-vol
  nodeSelector: {"node-role.kubernetes.io/control-plane": ""}
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

node:
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
  nodeSelector: {"kubernetes.io/os": "linux"}
  tolerations:
    - operator: "Exists"

driver:
  image: quay.io/dell/container-storage-modules/csi-powerstore:v2.18.0

# The chart defaults metrics.prometheusRule.enabled to TRUE while metrics.enabled
# defaults to false. So an operator who sets only metrics.enabled=true also gets a
# PrometheusRule, which needs the monitoring.coreos.com CRDs. Those come from
# app-prometheus, which is desired_state: uploaded and is NOT auto-applied -- so the
# apply fails with no capability guard. Pinning the sub-key keeps enabling metrics a
# safe operation; a user override can still turn the rule back on deliberately.
metrics:
  prometheusRule:
    enabled: false

podmon:
  image: quay.io/dell/container-storage-modules/podmon:v1.17.0
  # Same reasoning as metrics.prometheusRule above: templates/prometheusrule.yaml has a
  # SECOND, independently-gated PrometheusRule block keyed on podmon.metrics.prometheusRule
  # (chart default TRUE). The metrics.* pin above does not cover it, so pin it here too to
  # keep enabling podmon/resiliency a safe operation without the monitoring.coreos.com CRDs.
  # A user override can still turn it back on deliberately.
  metrics:
    prometheusRule:
      enabled: false

secret:
  arrays:

storageClasses:

labels:
  isApplication: false

authorization:
  image: quay.io/dell/container-storage-modules/csm-authorization-sidecar:v2.6.0
