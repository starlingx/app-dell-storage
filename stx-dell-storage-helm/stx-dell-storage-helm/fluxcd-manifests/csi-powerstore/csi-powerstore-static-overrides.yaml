csm:
  replication: false
  resiliency: false

app.starlingx.io/component: platform

controller:
  metadataretriever:
    image: dellemc/csi-metadata-retriever:v1.3.0
  attacher:
    image: k8s.gcr.io/sig-storage/csi-attacher:v4.2.0
  healthMonitor:
    image: gcr.io/k8s-staging-sig-storage/csi-external-health-monitor-controller:v0.8.0
  provisioner:
    image: k8s.gcr.io/sig-storage/csi-provisioner:v3.4.1
  replication:
    image: dellemc/dell-csi-replicator:v1.4.0
  resizer:
    image: k8s.gcr.io/sig-storage/csi-resizer:v1.7.0
  vgsnapshot:
    image: dellemc/csi-volumegroup-snapshotter:v1.2.0
  snapshot:
    image: k8s.gcr.io/sig-storage/csi-snapshotter:v6.2.1
    snapNamePrefix: csi-powerstore-snap
  volumeNamePrefix: csi-powerstore-vol
  tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

node:
  registrar:
    image: k8s.gcr.io/sig-storage/csi-node-driver-registrar:v2.6.3
  tolerations:
  - operator: "Exists"

driver:
  image: dellemc/csi-powerstore:v2.6.0

podmon:
  image: dellemc/podmon:v1.5.0

secrets:
  create: true
  arrays:

storageClasses:
