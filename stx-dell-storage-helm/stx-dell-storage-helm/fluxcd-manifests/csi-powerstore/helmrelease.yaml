apiVersion: "helm.toolkit.fluxcd.io/v2"
kind: HelmRelease
metadata:
  name: csi-powerstore
  labels:
    chart_group: dell-storage-charts
spec:
  releaseName: csi-powerstore
  chart:
    spec:
      chart: csi-powerstore
      version: REPLACE_HELM_CHART_VERSION
      sourceRef:
        kind: HelmRepository
        name: stx-platform
  interval: 1m
  timeout: 30m
  test:
    enable: false
  install:
    disableHooks: false
  upgrade:
    disableHooks: false
    # csi-powerstore ships volumejournals.dr.storage.dell.com via its bundled
    # csm-disaster-recovery subchart, which moved 1.0.0 -> 1.2.0 in this upversion and
    # added 7 optional fields (3 spec, 4 status). CRDs live in crds/, and the Flux
    # default for both install.crds and upgrade.crds is `Create` -- which creates a
    # missing CRD but never updates an existing one. So a cluster first installed at
    # 2.16.0 keeps the 1.0.0 CRD, and apiextensions.k8s.io/v1 then SILENTLY PRUNES the
    # new fields the 2.18.0 driver writes. CreateReplace is safe here because the
    # schema change is additive-only: no field was removed, retyped, or made required,
    # so replacing the CRD invalidates no existing VolumeJournal.
    #
    # DO NOT copy this to csm-observability. That chart's crds/ dir ships six
    # cert-manager CRDs labelled v1.11.0 while the platform cert-manager app is
    # v1.20.2; a CreateReplace there would overwrite the platform's CRDs with the
    # older set on every dell-storage upgrade. The v1.11 -> v1.20.2 delta is
    # additive-only, so it would fail silently by pruning rather than loudly.
    # csm-replication needs no policy either: its CRDs are byte-identical across
    # 1.14.0 and 1.16.0. csi-powermax ships its crds/ dir new in 2.18.0, so there is
    # no prior version to upgrade from.
    crds: CreateReplace
  valuesFrom:
    - kind: Secret
      name: csi-powerstore-static-overrides
      valuesKey: csi-powerstore-static-overrides.yaml
    - kind: Secret
      name: csi-powerstore-system-overrides
      valuesKey: csi-powerstore-system-overrides.yaml
