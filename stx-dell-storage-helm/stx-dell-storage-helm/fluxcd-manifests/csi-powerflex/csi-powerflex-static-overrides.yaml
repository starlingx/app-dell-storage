csm:
  authorization: false
  replication: false
  resiliency: false

labels:
  isApplication: false

controller:
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.10.0
  healthMonitor:
    image: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.16.0
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.1.0
  replication:
    image: quay.io/dell/container-storage-modules/dell-csi-replicator:v1.14.0
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v2.0.0
  snapshot:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.4.0
    snapNamePrefix: csi-powerflex-snap
  volumeNamePrefix: csi-powerflex-vol
  nodeSelector: {"node-role.kubernetes.io/control-plane": ""}
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

node:
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.15.0
  powerflexSdc:
    image: quay.io/dell/storage/powerflex/sdc:5.0
  nodeSelector: {"kubernetes.io/os": "linux"}
  tolerations:
    - operator: "Exists"

driver:
  image: quay.io/dell/container-storage-modules/csi-vxflexos:v2.16.1

vgsnapshotter:
  image: quay.io/dell/container-storage-modules/csi-volumegroup-snapshotter:v1.8.1

podmon:
  image: quay.io/dell/container-storage-modules/podmon:v1.15.0

authorization:
  image: quay.io/dell/container-storage-modules/csm-authorization-sidecar:v2.4.0

kubectl:
  image: docker.io/alpine/kubectl:1.35.3

secret:

storageClasses:

proxyAuthzTokens:
