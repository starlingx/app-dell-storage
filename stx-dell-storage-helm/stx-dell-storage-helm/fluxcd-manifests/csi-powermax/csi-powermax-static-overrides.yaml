global:
  credentialsSecret:
  defaultSecret:
    username:
    password:
  managementServers: []

csm:
  authorization: false
  replication: false

labels:
  isApplication: false

driver:
  image: quay.io/dell/container-storage-modules/csi-powermax:v2.15.0

controller:
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v5.3.0
  snapshot:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.3.0
    snapNamePrefix: csi-powermax-snap
    deletionPolicy: Delete
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v1.14.0
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.9.0
  healthMonitor:
    image: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.15.0

  volumeNamePrefix: csi-powermax-vol
  nodeSelector: { "node-role.kubernetes.io/control-plane": "" }
  tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

node:
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.14.0
  noderescan:
    image: quay.io/dell/container-storage-modules/dell-csi-node-rescanner:v1.8.0
  nodeSelector: { "kubernetes.io/os": "linux" }
  tolerations:
  - operator: "Exists"

csireverseproxy:
  image: quay.io/dell/container-storage-modules/csipowermax-reverseproxy:v2.14.0

authorization:
  image: quay.io/dell/container-storage-modules/csm-authorization-sidecar:v2.3.0
  rootCertificate:
  configs:


replication:
  image: quay.io/dell/container-storage-modules/dell-csi-replicator:v1.13.0

migration:
  image: quay.io/dell/container-storage-modules/dell-csi-migrator:v1.9.0

driverName: "csi-powermax.dellemc.com"

proxyAuthzTokens:
  access:
  refresh:

certSecret:

storageClasses:

kubectl:
  image: docker.io/bitnamilegacy/kubectl:1.33.4
