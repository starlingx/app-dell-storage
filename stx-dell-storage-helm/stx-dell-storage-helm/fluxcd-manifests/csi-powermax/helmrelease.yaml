apiVersion: "helm.toolkit.fluxcd.io/v2"
kind: HelmRelease
metadata:
  name: csi-powermax
  labels:
    chart_group: dell-storage-charts
spec:
  releaseName: csi-powermax
  chart:
    spec:
      chart: csi-powermax
      version: REPLACE_HELM_CHART_VERSION
      sourceRef:
        kind: HelmRepository
        name: stx-platform
  interval: 1m
  timeout: 30m
  test:
    enable: false
  install:
    disableHooks: false
  upgrade:
    disableHooks: false
  valuesFrom:
    - kind: Secret
      name: csi-powermax-static-overrides
      valuesKey: csi-powermax-static-overrides.yaml
    - kind: Secret
      name: csi-powermax-system-overrides
      valuesKey: csi-powermax-system-overrides.yaml
