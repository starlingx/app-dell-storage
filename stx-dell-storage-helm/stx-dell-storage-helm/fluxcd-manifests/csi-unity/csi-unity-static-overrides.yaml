csm:
  resiliency: false

app.starlingx.io/component: platform

controller:
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.3.0
  healthMonitor:
    image: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.9.0
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v3.5.0
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v1.8.0
  snapshot:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v6.2.2
    snapNamePrefix: csi-unity-snap
  volumeNamePrefix: csi-unity-vol
  tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

node:
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.8.0
  nodeNamePrefix: csi-unity-node
  tolerations:
  - operator: "Exists"

driver:
  image: docker.io/dellemc/csi-unity:v2.7.0

podmon:
  image: docker.io/dellemc/podmon:v1.6.0
