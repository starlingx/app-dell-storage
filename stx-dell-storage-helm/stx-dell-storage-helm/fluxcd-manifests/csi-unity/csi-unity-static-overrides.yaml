csm:
  resiliency: false

labels:
  isApplication: false

controller:
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
  healthMonitor:
    image: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.18.0
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
  snapshot:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
    snapNamePrefix: csi-unity-snap
  volumeNamePrefix: csi-unity-vol
  nodeSelector: {"node-role.kubernetes.io/control-plane": ""}
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

# templates/node.yaml reads nodeNamePrefix at the top level, not under node:.
# The csi-unity v2.18.0 driver does not read X_CSI_UNITY_NODENAME_PREFIX, so
# this only corrects the rendered value; array host names are unaffected.
nodeNamePrefix: csi-unity-node

node:
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
  nodeSelector: {"kubernetes.io/os": "linux"}
  tolerations:
    - operator: "Exists"

driver:
  image: quay.io/dell/container-storage-modules/csi-unity:v2.18.0

podmon:
  image: quay.io/dell/container-storage-modules/podmon:v1.17.0

storageClasses:

secret:
